<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Register - Smart Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass-card auth-card">
            <div class="auth-header" style="text-align: center;">
                <img src="images/logo.png" alt="Smart Tracker Logo" style="max-width: 100px; height: auto; display: block; margin: 0 auto 15px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));">
                <h2>Create an Account</h2>
                <p>Start managing your expenses smarter</p>
            </div>
            
            <div id="error-msg" class="error-msg"></div>
            
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <input type="text" id="name" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" class="form-control" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <input type="tel" id="mobileNumber" class="form-control" placeholder="Mobile Number" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="Password" required minlength="6">
                </div>
                <div class="form-group">
                    <select id="role" class="form-control" required style="cursor: pointer;">
                        <option value="" disabled selected>Select Role</option>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>
            
            <div class="auth-links">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script src="js/auth.js?v=2"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const mobileNumber = document.getElementById('mobileNumber').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            registerUser(name, email, mobileNumber, password, role);
        });
    </script>
</body>
</html>
