<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Expense Receipt - Smart Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .receipt-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 0;
        }
        .loading-state i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        #pdf-iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 8px;
            display: none;
            margin-top: 20px;
        }
        .actions {
            margin-top: 20px;
            display: none;
            gap: 15px;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="receipt-container">
        <h2>Smart Expense Receipt</h2>
        
        <div id="loading" class="loading-state">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading secure receipt...</p>
        </div>
        
        <div id="error-message" style="display: none; color: var(--danger-color); padding: 30px;">
            <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 15px;"></i>
            <p>Receipt not found or you do not have permission to view it.</p>
        </div>

        <iframe id="pdf-iframe"></iframe>

        <div id="actions" class="actions">
            <button onclick="downloadPDF()" class="btn btn-primary"><i class="fas fa-download"></i> Download PDF</button>
        </div>
    </div>

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/receipt.js"></script>
</body>
</html>
