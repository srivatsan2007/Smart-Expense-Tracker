<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Bills - Smart Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/calculator.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <button id="mobile-menu-btn" class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
        <aside class="sidebar" id="sidebar">
            <div class="logo" style="text-align: center; padding: 15px 0;">
                <img src="images/logo.png" alt="Smart Tracker Logo" style="max-width: 80px; height: auto; display: block; margin: 0 auto 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));">
                <h2 style="color: var(--primary-color); font-weight: 800; font-size: 1.2rem; margin: 0;">Smart Tracker</h2>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fas fa-chart-line" style="width: 25px;"></i> Dashboard</a></li>
                <li><a href="expenses.html"><i class="fas fa-wallet" style="width: 25px;"></i> Expenses</a></li>
                <li><a href="bills.html" class="active"><i class="fas fa-file-invoice" style="width: 25px;"></i> Bills</a></li>
                <li><a href="salary.html"><i class="fas fa-money-bill-wave" style="width: 25px;"></i> Salary</a></li>
                <li><a href="savings-goals.html"><i class="fas fa-bullseye" style="width: 25px;"></i> Savings Goals</a></li>
                <li><a href="reports.html"><i class="fas fa-file-export" style="width: 25px;"></i> Reports</a></li>
                <li><a href="settings.html"><i class="fas fa-cog" style="width: 25px;"></i> Settings</a></li>
                <li><a href="#" id="logout-btn"><i class="fas fa-sign-out-alt" style="width: 25px;"></i> Logout</a></li>
            </ul>
            <div class="theme-switch" id="theme-switch">
                <i class="fas fa-moon"></i> <span style="margin-left: 10px;">Toggle Theme</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h1>Bill Reminders</h1>
                    <p style="color: #777;">Manage upcoming bills and payments</p>
                </div>
            </div>

            <!-- Add Bill Form -->
            <div class="glass-card" style="margin-bottom: 30px;">
                <h3>Add New Bill</h3>
                <form id="bill-form" class="form-grid" style="margin-top: 15px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <input type="text" id="billName" class="form-control" placeholder="Bill Name (e.g. Internet)" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <input type="number" id="amount" class="form-control" placeholder="Amount (₹)" required step="0.01">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <input type="date" id="dueDate" class="form-control" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <select id="category" class="form-control" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Internet/Phone">Internet/Phone</option>
                            <option value="Rent/Mortgage">Rent/Mortgage</option>
                            <option value="Insurance">Insurance</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Subscriptions">Subscriptions</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <select id="recurring" class="form-control" required>
                            <option value="none" selected>One-time Bill (No Recurring)</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                    </div>
                    <div style="grid-column: 1 / -1; display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary" style="flex: 1;">Save Bill Reminder</button>
                    </div>
                </form>
            </div>

            <!-- Bills List -->
            <div class="glass-card">
                <h3>Your Bills</h3>
                <div class="table-wrapper">
                    <table id="bills-table">
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Bill Name</th>
                                <th>Due Date</th>
                                <th>Category</th>
                                <th>Recurring</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated via JS -->
                            <tr><td colspan="7" style="text-align:center;">Loading bills...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/bills.js"></script>
    <script src="js/calculator.js"></script>
</body>
</html>
