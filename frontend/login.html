<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Login - Smart Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass-card auth-card">
            <div class="auth-header" style="text-align: center;">
                <img src="images/logo.png" alt="Smart Tracker Logo" style="max-width: 100px; height: auto; display: block; margin: 0 auto 15px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));">
                <h2>Welcome Back</h2>
                <p>Login to manage your expenses</p>
            </div>
            
            <div id="error-msg" class="error-msg"></div>
            
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="loginId">Email or Mobile Number</label>
                    <input type="text" id="loginId" class="form-control" required placeholder="Enter email or mobile number">
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            
            <div class="auth-links">
                <p>Don't have an account? <a href="register.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js?v=2"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const loginId = document.getElementById('loginId').value;
            const password = document.getElementById('password').value;
            loginUser(loginId, password);
        });
    </script>
</body>
</html>
