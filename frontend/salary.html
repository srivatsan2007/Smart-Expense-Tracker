<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Salary - Smart Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/calculator.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <button id="mobile-menu-btn" class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
        <aside class="sidebar" id="sidebar">
            <div class="logo" style="text-align: center; padding: 15px 0;">
                <img src="images/logo.png" alt="Smart Tracker Logo" style="max-width: 80px; height: auto; display: block; margin: 0 auto 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));">
                <h2 style="color: var(--primary-color); font-weight: 800; font-size: 1.2rem; margin: 0;">Smart Tracker</h2>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fas fa-chart-line" style="width: 25px;"></i> Dashboard</a></li>
                <li><a href="expenses.html"><i class="fas fa-wallet" style="width: 25px;"></i> Expenses</a></li>
                <li><a href="bills.html"><i class="fas fa-file-invoice" style="width: 25px;"></i> Bills</a></li>
                <li><a href="salary.html" class="active"><i class="fas fa-money-bill-wave" style="width: 25px;"></i> Salary</a></li>
                <li><a href="savings-goals.html"><i class="fas fa-bullseye" style="width: 25px;"></i> Savings Goals</a></li>
                <li><a href="reports.html"><i class="fas fa-file-export" style="width: 25px;"></i> Reports</a></li>
                <li><a href="settings.html"><i class="fas fa-cog" style="width: 25px;"></i> Settings</a></li>
                <li><a href="#" id="logout-btn"><i class="fas fa-sign-out-alt" style="width: 25px;"></i> Logout</a></li>
            </ul>
            <div class="theme-switch" id="theme-switch">
                <i class="fas fa-moon"></i> <span style="margin-left: 10px;">Toggle Theme</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h1>Salary Management</h1>
                    <p style="color: #777;">Track your monthly income</p>
                </div>
            </div>

            <!-- Add Salary Form -->
            <div class="glass-card" style="margin-bottom: 30px;">
                <h3>Add Monthly Salary</h3>
                <form id="salary-form" class="form-grid" style="margin-top: 15px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <input type="number" id="amount" class="form-control" placeholder="Amount (₹)" required step="0.01">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <select id="month" class="form-control" required>
                            <option value="" disabled selected>Select Month</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <input type="number" id="year" class="form-control" placeholder="Year (e.g. 2026)" required min="2000" max="2100">
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Salary</button>
                    </div>
                </form>
            </div>

            <!-- Salary History -->
            <div class="glass-card">
                <h3>Salary History</h3>
                <div class="table-wrapper">
                    <table id="salaries-table">
                        <thead>
                            <tr>
                                <th>Month</th>
                                <th>Year</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

        <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/salary.js"></script>
    <script src="js/calculator.js"></script>
</body>
</html>
